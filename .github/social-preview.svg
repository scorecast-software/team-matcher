<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <path d="M0 80 H1280 M0 160 H1280 M0 240 H1280 M0 320 H1280 M0 400 H1280 M0 480 H1280 M0 560 H1280"/>
    <path d="M80 0 V640 M160 0 V640 M240 0 V640 M320 0 V640 M400 0 V640 M480 0 V640 M560 0 V640 M640 0 V640 M720 0 V640 M800 0 V640 M880 0 V640 M960 0 V640 M1040 0 V640 M1120 0 V640 M1200 0 V640"/>
  </g>

  <!-- Title -->
  <text x="80" y="170" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="96" font-weight="800" fill="#f8fafc">team-matcher</text>

  <text x="80" y="225" font-family="Inter, system-ui, sans-serif"
        font-size="28" font-weight="500" fill="#94a3b8">Fuzzy fixture matcher for sports data feeds</text>

  <!-- Match demo -->
  <g transform="translate(80, 290)">
    <!-- left card -->
    <rect x="0" y="0" width="420" height="180" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="24" y="38" font-family="JetBrains Mono, Consolas, monospace" font-size="16" fill="#64748b">SOURCE A</text>
    <text x="24" y="80" font-family="Inter, sans-serif" font-size="32" font-weight="700" fill="#f8fafc">Man Utd</text>
    <text x="24" y="120" font-family="Inter, sans-serif" font-size="20" fill="#94a3b8">vs Liverpool</text>
    <text x="24" y="152" font-family="Inter, sans-serif" font-size="16" fill="#64748b">EPL · 19:45</text>

    <!-- arrow -->
    <g transform="translate(450, 90)" filter="url(#glow)">
      <path d="M0 0 L60 0 M40 -12 L60 0 L40 12" stroke="url(#accent)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="455" y="60" font-family="JetBrains Mono, monospace" font-size="22" font-weight="700" fill="url(#accent)">0.94</text>

    <!-- right card -->
    <rect x="540" y="0" width="540" height="180" rx="16" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
    <text x="564" y="38" font-family="JetBrains Mono, monospace" font-size="16" fill="#64748b">SOURCE B</text>
    <text x="564" y="80" font-family="Inter, sans-serif" font-size="32" font-weight="700" fill="#f8fafc">Manchester United FC</text>
    <text x="564" y="120" font-family="Inter, sans-serif" font-size="20" fill="#94a3b8">vs Liverpool FC</text>
    <text x="564" y="152" font-family="Inter, sans-serif" font-size="16" fill="#64748b">Premier League · 19:45</text>
  </g>

  <!-- Features -->
  <g transform="translate(80, 520)" font-family="Inter, sans-serif" font-size="20" fill="#cbd5e1" font-weight="500">
    <circle cx="8" cy="-7" r="4" fill="#22d3ee"/>
    <text x="24" y="0">Jaccard + Containment</text>

    <circle cx="288" cy="-7" r="4" fill="#22d3ee"/>
    <text x="304" y="0">Swap detection</text>

    <circle cx="528" cy="-7" r="4" fill="#22d3ee"/>
    <text x="544" y="0">Kickoff-time bonus</text>

    <circle cx="808" cy="-7" r="4" fill="#22d3ee"/>
    <text x="824" y="0">Zero dependencies</text>
  </g>

  <!-- Install -->
  <g transform="translate(80, 580)">
    <rect x="-8" y="-28" width="380" height="44" rx="8" fill="#020617" stroke="#334155"/>
    <text x="8" y="2" font-family="JetBrains Mono, Consolas, monospace" font-size="20" fill="#22d3ee">$ pip install team-matcher</text>
  </g>

  <!-- Footer right -->
  <text x="1200" y="600" text-anchor="end" font-family="Inter, sans-serif" font-size="16" fill="#64748b">
    MIT · Python 3.9–3.13 · scorecast.info
  </text>
</svg>
